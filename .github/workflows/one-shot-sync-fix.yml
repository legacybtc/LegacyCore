name: One-shot sync fix

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch sync engine
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('internal/p2p/server.go')
          text = path.read_text(encoding='utf-8')
          original = text
          replacements = [
              ('userAgent                    = "/Legacy-GO:1.0.33/"', 'userAgent                    = "/Legacy-GO:1.0.36/"'),
              ('''\ttype wantedBlock struct {\n\t\theader wire.BlockHeader\n\t\thash   chainhash.Hash\n\t\tlegacy chainhash.Hash\n\t}''', '''\ttype wantedBlock struct {\n\t\theader wire.BlockHeader\n\t\thash   chainhash.Hash\n\t}'''),
              ('''\t\tlegacy, err := s.chain.LegacyHeaderHash(headers[i])\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf("legacy hash for header %d: %w", i, err)\n\t\t}\n\t\twanted = append(wanted, wantedBlock{header: headers[i], hash: hash, legacy: legacy})''', '''\t\twanted = append(wanted, wantedBlock{header: headers[i], hash: hash})'''),
              ('''\t\tfor batchStart < len(wanted) && len(batch) < maxGetDataItems-1 {\n\t\t\tw := wanted[batchStart]\n\t\t\tbatchStart++\n\t\t\tbatchBlocks++\n\t\t\tbatch = append(batch, wire.InvVect{Type: wire.InvTypeBlock, Hash: w.hash})\n\t\t\tbatch = append(batch, wire.InvVect{Type: wire.InvTypeBlock, Hash: w.legacy})\n\t\t}''', '''\t\tfor batchStart < len(wanted) && len(batch) < maxGetDataItems {\n\t\t\tw := wanted[batchStart]\n\t\t\tbatchStart++\n\t\t\tbatchBlocks++\n\t\t\tbatch = append(batch, wire.InvVect{Type: wire.InvTypeBlock, Hash: w.hash})\n\t\t}'''),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          if text == original:
              raise SystemExit('sync hardening patch made no changes')
          if 'batch = append(batch, wire.InvVect{Type: wire.InvTypeBlock, Hash: w.legacy})' in text:
              raise SystemExit('duplicate legacy block request remains')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > internal/p2p/sync_request_shape_test.go <<'EOF'
          package p2p

          import (
              "os"
              "strings"
              "testing"
          )

          func TestSyncRequestsUseCanonicalBlockHashOnly(t *testing.T) {
              b, err := os.ReadFile("server.go")
              if err != nil { t.Fatal(err) }
              s := string(b)
              if strings.Contains(s, "batch = append(batch, wire.InvVect{Type: wire.InvTypeBlock, Hash: w.legacy})") {
                  t.Fatal("sync engine must not request legacy SHA256d hash alongside canonical block hash")
              }
          }
          EOF

      - name: Test and build
        run: |
          gofmt -w internal/p2p/server.go internal/p2p/sync_request_shape_test.go
          go test ./internal/p2p
          go test -race ./internal/p2p
          go vet ./internal/p2p
          go test ./...
          go test -race ./internal/p2p ./internal/blockchain ./internal/nodeservice
          go vet ./...
          CGO_ENABLED=1 go build -buildvcs=false -o /tmp/legacycoind ./cmd/legacycoind
          CGO_ENABLED=1 go build -buildvcs=false -o /tmp/legacycoin-cli ./cmd/legacycoin-cli
          CGO_ENABLED=1 go build -buildvcs=false -o /tmp/legacywallet ./cmd/legacywallet

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Legacy Coin"
          git config user.email "legacycoinbtc@gmail.com"
          git add internal/p2p/server.go internal/p2p/sync_request_shape_test.go
          git commit -m "fix: harden header-driven block synchronization"
          git push origin HEAD:main
          git rm .github/workflows/one-shot-sync-fix.yml
          git commit -m "chore: remove one-shot sync fix workflow"
          git push origin HEAD:main
