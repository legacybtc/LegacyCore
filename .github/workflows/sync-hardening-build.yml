name: Sync hardening candidate build

on:
  push:
    branches:
      - chatgpt/sync-hardening-2026-08-20
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Apply sync hardening
        run: python3 scripts/apply-sync-hardening-2026-08-20.py

      - name: Format changed Go files
        run: gofmt -w internal/p2p/server.go internal/p2p/sync_batch_regression_test.go

      - name: Run Go tests
        run: go test -count=1 ./...

      - name: Run race tests
        run: go test -race -short -count=1 ./internal/p2p ./internal/blockchain

      - name: Vet
        run: go vet ./...

      - name: Build daemon
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o legacycoind ./cmd/legacycoind

      - name: Build CLI
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o legacycoin-cli ./cmd/legacycoin-cli

      - name: Build wallet smoke binary
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -o legacy-wallet-compile-smoke ./cmd/legacywallet

      - name: Package candidate source and Linux apps
        run: |
          tar --exclude=.git -czf LegacyCore-sync-hardening-source.tar.gz .
          tar -czf LegacyCore-sync-hardening-linux-amd64.tar.gz legacycoind legacycoin-cli legacy-wallet-compile-smoke

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LegacyCore-sync-hardening-candidate
          path: |
            LegacyCore-sync-hardening-source.tar.gz
            LegacyCore-sync-hardening-linux-amd64.tar.gz

      - name: Commit hardened source to candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/p2p/server.go internal/p2p/sync_batch_regression_test.go
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "p2p: harden sync getdata batching"
          git push origin HEAD:chatgpt/sync-hardening-2026-08-20
